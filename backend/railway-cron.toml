# Railway service config — ops cron
#
# This file is consumed by a separate Railway service (NOT the web
# or worker service). Set the service's Config Path to
# `backend/railway-cron.toml` in the Railway dashboard.
#
# Railway supports one cron schedule/start command per service config.
# This service therefore runs the queued-job watchdog every 10 minutes
# and also runs the daily digest during the 12:00 UTC hour.
#
# The daily digest gate preserves the previous 12:00 UTC delivery window:
#   - 7:00 AM ET when standard time (EST)
#   - 8:00 AM ET when daylight saving (EDT)
# `run_once(force=False)` keeps duplicate invocations inside the hour
# idempotent through the 23h `last_email_sent_at` cooldown.
#
# Run-time itself is brief (typically <10 seconds — one INSERT per
# eligible filter into parcel_buybox_scores.notified_at, plus a
# single Resend POST per filter). Railway shuts the container down
# after the command exits.
#
# Idempotency: `run_once(force=False)` respects the 23h
# `last_email_sent_at` cooldown on each BuyboxFilter, so a duplicate
# fire (Railway retry, schedule glitch) is a no-op. The per-parcel
# `notified_at` gate inside `_top_parcels_for_filter` independently
# prevents re-emailing the same parcel.
#
# To verify after first deploy:
#   1. Click "Run Now" in the Railway service UI — confirms the
#      container builds + the command exits 0 + the email lands.
#   2. Wait for the next scheduled fire. Cross-check by querying
#      `SELECT name, last_email_sent_at FROM buybox_filters
#         WHERE daily_email_enabled = true`
#      and confirming the timestamps moved without you doing
#      anything manual.

# redeploy marker 2026-05-27 — forces Railway to rebuild and re-read the
# startCommand below. A prior deploy kept running a stale cached command
# (the old shell date-gate), so the digest module never executed.
[build]
builder = "NIXPACKS"
buildCommand = "pip install --no-cache-dir -e ."

[deploy]
# ONE command, no shell logic. The watchdog tick itself runs the digest,
# the nightly refresh and the ordinance sentinel as subprocesses (see
# `_run_digest_tick` / `_run_refresh_tick` / `_run_sentinel_tick`), each
# self-gating to its own hour, and it owns the exit code.
#
# The previous value chained a second `python -m app.workers.daily_email`
# after the watchdog and re-raised any nonzero sub-exit through the shell.
# Both were wrong (2026-10-09): the digest ran twice per tick, and the
# shell re-raise reintroduced the very thing we removed in Python — on a
# `restartPolicyType = NEVER` cron service Railway reads ANY nonzero exit
# as "Deploy Crashed!" and emails the account owner, so informational
# codes must never reach the shell. Sub-task status is recorded in
# `ops_cron_heartbeat` instead; the watchdog exits nonzero only when it
# could not write that row.
#
# Also do NOT gate the digest with a shell `[ "$(date -u +%H)" = "12" ]`
# test: that form silently evaluated false on Railway and the digest never
# fired for 4 days (May 23–27). Avoid $(...) substitution in this string.
startCommand = "python scripts/queued_job_watchdog.py"
# Cron syntax: minute hour day-of-month month day-of-week
# `*/10 * * * *` = every 10 minutes UTC
cronSchedule = "*/10 * * * *"
# Never auto-restart — the script is a one-shot. Restart-on-fail
# would create infinite loops on Resend outages.
restartPolicyType = "NEVER"
