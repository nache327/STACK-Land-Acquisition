# Gitleaks config. Without this file gitleaks logs
#   "no gitleaks config found in path .gitleaks.toml, using default gitleaks config"
# and has no way to record a triaged false positive.
#
# WHY IT APPEARED NOW: on pull_request events the action scans only the PR diff, so
# history is never re-examined and this finding stayed invisible. The
# workflow_dispatch trigger added in ci.yml scans FULL history
# (`git log -p --full-history --all`, ~1442 commits), which surfaced a 2026-05-19
# commit. Nothing in current code introduced it.
#
# Left un-triaged, every dispatch run would fail on a known false positive — and a
# check that is always red is a check nobody reads, which is how a REAL leak gets
# missed. Allowlisted by exact fingerprint (commit + path + rule + line), NOT by
# rule or by path, so any other finding — including a genuine secret in that same
# file — still fails the build.

[extend]
useDefault = true

[[allowlists]]
description = """
False positive, triaged 2026-07-27. generic-api-key fired on a `key:` PROPERTY in
a deleted admin runbook module. The value is a 13-char domain slug of the form
<phase><n>_<state>_<town>; the same file has 8 `key:` entries, all slug-shaped,
and this is the only one containing a digit — which is what pushed its entropy
(3.55) over the rule's threshold. It is not a credential, so there is nothing to
rotate. The file no longer exists on main.
"""
fingerprints = [
  "38e3b0fbb7db5fd3bf5c5a7517073bd35ddd1aad:frontend/lib/admin/municipalityRunbook.ts:generic-api-key:78",
]
